<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phrase Bank</title>
<meta name="description" content="上課、跟同學聊天、coffee chat 和面試用得到的英文句子，附單字卡、學習和測驗模式。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb;
  --surface:#ffffff;
  --surface-2:#edeff4;
  --ink:#282e3e;
  --muted:#586380;
  --line:#d9dde8;
  --accent:#4255ff;
  --accent-hover:#3341d6;
  --accent-ink:#ffffff;
  --accent-soft:#e8eaff;
  --star:#f2a50c;
  --good:#12a26b; --good-bg:#dff5ec;
  --bad:#d64541; --bad-bg:#fde7e6;
  --casual:#b25a00; --casual-bg:#fff0dc;
  --neutral:#0a7a72; --neutral-bg:#dbf3f0;
  --formal:#6b45c8; --formal-bg:#efe8ff;
  --shadow:0 2px 6px rgb(40 46 62 / .06);
  --shadow-lift:0 6px 22px rgb(40 46 62 / .12);
  --font:"Manrope","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1030; --surface:#1d1f47; --surface-2:#2a2c5c; --ink:#f3f4fb; --muted:#aab2d3; --line:#363a6e;
    --accent:#7b88ff; --accent-hover:#97a1ff; --accent-ink:#0f1030; --accent-soft:#2b2f73; --star:#ffc93d;
    --good:#4fd6a0; --good-bg:#173f3a; --bad:#ff8a84; --bad-bg:#4a1f2f;
    --casual:#ffb862; --casual-bg:#43311f; --neutral:#5fd8cc; --neutral-bg:#173d43; --formal:#c3a8ff; --formal-bg:#352a66;
    --shadow:0 2px 6px rgb(0 0 0 / .3); --shadow-lift:0 10px 28px rgb(0 0 0 / .45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1030; --surface:#1d1f47; --surface-2:#2a2c5c; --ink:#f3f4fb; --muted:#aab2d3; --line:#363a6e;
  --accent:#7b88ff; --accent-hover:#97a1ff; --accent-ink:#0f1030; --accent-soft:#2b2f73; --star:#ffc93d;
  --good:#4fd6a0; --good-bg:#173f3a; --bad:#ff8a84; --bad-bg:#4a1f2f;
  --casual:#ffb862; --casual-bg:#43311f; --neutral:#5fd8cc; --neutral-bg:#173d43; --formal:#c3a8ff; --formal-bg:#352a66;
  --shadow:0 2px 6px rgb(0 0 0 / .3); --shadow-lift:0 10px 28px rgb(0 0 0 / .45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* Top nav */
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px;max-width:1120px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap;color:var(--ink);text-decoration:none}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px}
.search{position:relative;flex:1 1 auto;max-width:520px;margin-left:auto}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
#q{width:100%;height:42px;padding:0 14px 0 44px;border:2px solid transparent;border-radius:999px;background:var(--surface-2);transition:border-color .15s,background-color .15s}
#q::placeholder{color:var(--muted)}
#q:focus{outline:none;border-color:var(--accent);background:var(--surface)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;cursor:pointer;font-weight:700;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.lg{padding:14px 22px;font-size:17px;border-radius:12px}
.ib{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:background-color .15s,color .15s;flex:none}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.fav[aria-pressed="true"]{color:var(--star)}
.ib.fav[aria-pressed="true"] svg{fill:currentColor}
.ib.done[aria-pressed="true"]{color:var(--good)}
.ib.del:hover,.ib.del.armed{color:var(--bad);background:var(--bad-bg)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}

/* Home */
main.wrap{padding-top:28px;padding-bottom:64px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,color .15s,background-color .15s}
.tab:hover{color:var(--ink);border-color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tab .n{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.set-head{margin:22px 0 18px}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:10px 0 0;color:var(--muted);font-size:14px;font-weight:600}
.meta .pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.mode{display:flex;align-items:center;gap:12px;background:var(--surface);border:0;border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);font-weight:700;font-size:16px;text-align:left;border-bottom:3px solid transparent;transition:border-color .15s,box-shadow .15s}
.mode:hover{border-bottom-color:var(--accent);box-shadow:var(--shadow-lift)}
.mode .mi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.mode small{display:block;font-weight:500;font-size:13px;color:var(--muted)}

/* Flashcard viewer */
.viewer{margin-bottom:34px}
.flip{perspective:1800px;cursor:pointer;border-radius:16px}
.flip-in{position:relative;height:360px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lift);display:flex;flex-direction:column;padding:22px 28px}
.face.back{transform:rotateY(180deg)}
.face-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700;min-height:24px}
.face-text{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;margin:0;overflow:auto}
.face-text .big{font-size:28px;font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
.face-text .ex{font-size:15px;color:var(--muted);font-weight:500;max-width:56ch;margin:0}
.face-hint{text-align:center;font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion: reduce){ .flip-in{transition:none} }
@media (prefers-reduced-motion: no-preference){ .flip.enter{animation:slide .25s ease-out} }
@keyframes slide{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
.vctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:14px}
.vctl .mid{display:flex;align-items:center;gap:14px;font-weight:700;font-variant-numeric:tabular-nums}
.vctl .mid .ib{border:2px solid var(--line);width:48px;height:48px}
.vctl .mid .ib:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--surface)}
.vctl .right{display:flex;justify-content:flex-end;gap:2px}
.vbar{height:4px;background:var(--line);border-radius:4px;margin-top:14px;overflow:hidden}
.vbar i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* Progress */
.h2row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:0 0 14px}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:0}
h2 .c{color:var(--muted);font-weight:700;font-size:16px;margin-left:6px}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:34px}
.pbox{background:var(--surface);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--c)}
.pbox b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.pbox span{font-size:14px;color:var(--muted);font-weight:600}
.pbox.l{--c:var(--good)} .pbox.s{--c:var(--casual)} .pbox.f{--c:var(--star)}

/* Filters */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);transition:border-color .15s,color .15s,background-color .15s}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%}
.dot.casual{background:var(--casual)} .dot.neutral{background:var(--neutral)} .dot.formal{background:var(--formal)}

/* Term list */
.sec{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--muted);margin:24px 0 10px;text-transform:uppercase}
.terms{display:flex;flex-direction:column;gap:10px}
.term{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.term .t-en{padding:16px 20px;border-right:2px solid var(--bg)}
.term .t-en p{margin:0;font-weight:700;font-size:17px;line-height:1.4}
.term .t-zh{padding:16px 20px}
.term .t-zh p{margin:0}
.term .t-zh .ex{margin-top:6px;font-size:14px;color:var(--muted)}
.term .t-act{display:flex;align-items:flex-start;padding:8px 8px 0 0;gap:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.tag.casual{color:var(--casual);background:var(--casual-bg)}
.tag.neutral{color:var(--neutral);background:var(--neutral-bg)}
.tag.formal{color:var(--formal);background:var(--formal-bg)}
.tag.mine{color:var(--accent);background:var(--accent-soft)}
.tag.ok{color:var(--good);background:var(--good-bg)}
.empty{text-align:center;color:var(--muted);padding:48px 16px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);margin:0}
.foot{margin-top:36px;font-size:13px;color:var(--muted);text-align:center}

/* Study (Learn / Test) */
.study{min-height:100vh;display:flex;flex-direction:column}
.shead{background:var(--surface);border-bottom:1px solid var(--line)}
.shead .wrap{display:flex;align-items:center;gap:12px;height:64px;max-width:1120px}
.shead .title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.shead .count{margin-left:auto;margin-right:auto;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.smeter{height:4px;background:var(--line)}
.smeter i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sbody{flex:1;padding:32px 16px 48px}
.qcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lift);padding:26px 28px;display:flex;flex-direction:column;gap:18px}
@media (prefers-reduced-motion: no-preference){ .qcard.enter{animation:slide .25s ease-out} .reveal{animation:slide .25s ease-out} }
.qlabel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:700}
.qtext{font-size:26px;font-weight:700;line-height:1.35;margin:0;text-wrap:balance}
.reveal{border-top:2px solid var(--bg);padding-top:16px}
.reveal .en{font-size:21px;font-weight:700;margin:0}
.reveal .ex{color:var(--muted);margin:6px 0 0;font-size:15px}
.sub-h{font-size:13px;font-weight:800;color:var(--muted);margin:0}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1 1 160px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer;font-weight:600;line-height:1.4;transition:border-color .15s,background-color .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.fb{font-weight:700;margin:0;min-height:1.5em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.hint{text-align:center;font-size:13px;color:var(--muted);margin:14px 0 0}
kbd{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.result{text-align:center;align-items:center}
.ring{--p:0;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%), var(--surface-2) 0);display:grid;place-items:center}
.ring span{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px;flex-wrap:wrap;width:100%}
.stat{flex:1 1 120px;background:var(--surface-2);border-radius:12px;padding:10px 14px;text-align:left}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.misses{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.miss{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:15px}
.miss b{display:block}
.miss span{color:var(--muted)}

/* Add dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lift)}
dialog::backdrop{background:rgb(15 16 48 / .55)}
.dlg{padding:22px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{padding:10px 12px;border:2px solid transparent;border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:15px;font-weight:500}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.form textarea{resize:vertical;min-height:70px}
.form .end{display:flex;justify-content:flex-end;gap:8px}
.msg{font-size:14px;color:var(--good);font-weight:600;min-height:20px;margin:0}

.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:50;background:var(--ink);color:var(--surface);font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-lift);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:640px){
  .top .wrap{gap:8px}
  .brand .name{display:none}
  .hide-sm{display:none}
  #btnAdd{padding:9px 12px}
  h1{font-size:28px}
  .modes{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .mode{flex-direction:column;align-items:flex-start;gap:8px;padding:12px;font-size:15px}
  .mode small{display:none}
  .flip-in{height:300px}
  .face{padding:18px}
  .face-text .big{font-size:22px}
  .vctl{grid-template-columns:auto 1fr auto}
  .vctl .mid{justify-content:center;gap:10px}
  .prog{gap:8px}
  .pbox{padding:10px 12px}
  .pbox b{font-size:22px}
  .term{grid-template-columns:1fr}
  .term .t-en{border-right:0;padding:14px 16px 0}
  .term .t-zh{padding:10px 16px 6px}
  .term .t-act{padding:0 8px 6px;justify-content:flex-end;border-top:2px solid var(--bg)}
  .term .t-act .ib{width:40px;height:40px}
  .qcard{padding:20px 18px}
  .qtext{font-size:22px}
  .opts{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .hint{display:none}
}
</style>
</head>
<body>
<nav class="top" id="nav">
  <div class="wrap">
    <a class="brand" href="#" id="home-link"><span class="logo" aria-hidden="true">P</span><span class="name">Phrase Bank</span></a>
    <div class="search">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋英文或中文" aria-label="搜尋">
    </div>
    <button class="btn primary" id="btnAdd" type="button">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="hide-sm">新增句子</span>
    </button>
    <button class="ib" id="btnTheme" type="button" aria-label="切換深色模式" title="切換深色模式">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</nav>

<main class="wrap" id="home">
  <div class="tabs" role="tablist" id="tabs" aria-label="分類"></div>
  <header class="set-head">
    <h1 id="setTitle"></h1>
    <p class="meta" id="setMeta"></p>
  </header>

  <div class="modes">
    <button class="mode" type="button" id="mFlash">
      <span class="mi"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2.5"/><path d="M7 3.5h11.5A2.5 2.5 0 0 1 21 6v11.5"/></svg></span>
      <span>單字卡<small>點卡片翻面</small></span>
    </button>
    <button class="mode" type="button" id="mLearn">
      <span class="mi"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg></span>
      <span>學習<small>記得了 / 還不熟</small></span>
    </button>
    <button class="mode" type="button" id="mTest">
      <span class="mi"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7.5L19 8v11a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 6 19V5a1.5 1.5 0 0 1 1-1.5z"/><path d="M9.5 13.5l2 2 4-4.5"/></svg></span>
      <span>測驗<small>四選一</small></span>
    </button>
  </div>

  <section class="viewer" id="viewer" aria-label="單字卡"></section>

  <div class="h2row"><h2>你的進度</h2></div>
  <div class="prog" id="prog"></div>

  <div class="h2row">
    <h2>這組的句子<span class="c" id="listCount"></span></h2>
    <div class="chips" id="chips"></div>
  </div>

function snap(){ return {fav:Array.from(fav), learned:Array.from(learned), custom:custom}; }
function applySnap(s){
  fav = new Set((s && s.fav) || []);
  learned = new Set((s && s.learned) || []);
  custom = ((s && s.custom) || []).filter(function(c){ return c && c.en && c.zh; });
}
try{
  var raw = localStorage.getItem(LS_KEY);
  if(raw){ applySnap(JSON.parse(raw)); }
  var pf = JSON.parse(localStorage.getItem("phraseBank.prefs") || "{}");
  if(pf.front === "en" || pf.front === "zh") V.front = pf.front;
  if(pf.theme === "dark" || pf.theme === "light") document.documentElement.setAttribute("data-theme", pf.theme);
}catch(e){}
function savePrefs(){
  try{ localStorage.setItem("phraseBank.prefs", JSON.stringify({front:V.front, theme:document.documentElement.getAttribute("data-theme") || ""})); }catch(e){}
}

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(snap())); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    if(!dbDoc) return;
    try{
      Promise.resolve(dbDoc.set(snap())).then(function(){ setSync("cloud"); }, function(){ setSync("local"); });
    }catch(e){ setSync("local"); }
  }, 500);
}
function setSync(m){
  $("foot").textContent = m === "cloud"
    ? "收藏、學習進度和新增的句子已存到你的帳號，換裝置也會在。"
    : "收藏、學習進度和新增的句子目前只存在這個瀏覽器。";
}

/* ---------- Helpers ---------- */
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function $(id){ return document.getElementById(id); }
function allItems(){ return BUILTIN.concat(custom); }
function norm(s){ return String(s || "").toLowerCase(); }
function tabName(k){ var t = TABS.filter(function(x){ return x.k === k; })[0]; return t ? t.n : k; }
function iconBtn(cls, icon, label){
  var b = el("button", "ib " + cls); b.type = "button";
  b.innerHTML = icon;
  b.setAttribute("aria-label", label); b.title = label;
  return b;
}
var toastTimer = null;
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1400);
}
function filtered(){
  var q = norm(V.q).trim();
  return allItems().filter(function(it){
    if(it.tab !== V.tab) return false;
    if(V.tone !== "all" && it.tone !== V.tone) return false;
    if(V.fav && !fav.has(it.id)) return false;
    if(V.todo && learned.has(it.id)) return false;
    if(q){
      var hay = norm(it.en + " " + it.zh + " " + it.ex + " " + it.sec);
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function copyText(text){
  var done = function(ok){ toast(ok ? "已複製：" + (text.length > 40 ? text.slice(0,40) + "…" : text) : "複製失敗，請手動選取"); };
  try{
    navigator.clipboard.writeText(text).then(function(){ done(true); }, fallback);
  }catch(e){ fallback(); }
  function fallback(){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta); done(ok);
    }catch(e){ done(false); }
  }
}
var canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
function speak(text){
  if(!canSpeak){ toast("這個瀏覽器不支援朗讀"); return; }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = 0.95;
    var vs = speechSynthesis.getVoices().filter(function(v){ return /^en-GB/i.test(v.lang); });
    if(vs.length) u.voice = vs[0];
    speechSynthesis.speak(u);

/* ---------- Test (multiple choice) ---------- */
function startTest(){
  T = {deck:shuffle(filtered().slice()), i:0, picked:-1, opts:[], right:0, misses:[]};
  openStudy("test");
  buildOpts();
  renderTest(true);
}
function buildOpts(){
  var it = T.deck[T.i];
  if(!it){ T.opts = []; return; }
  var pool = allItems().filter(function(x){ return x.tab === it.tab && x.en !== it.en; });
  if(pool.length < 3) pool = allItems().filter(function(x){ return x.en !== it.en; });
  var seen = {}; seen[it.en] = true;
  var picks = [];
  shuffle(pool.slice()).forEach(function(x){ if(picks.length < 3 && !seen[x.en]){ seen[x.en] = true; picks.push(x); } });
  T.opts = shuffle(picks.concat([it]));
  T.picked = -1;
}
function pick(k){
  if(T.picked !== -1 || !T.opts[k]) return;
  T.picked = k;
  var it = T.deck[T.i];
  if(T.opts[k] === it) T.right++;
  else T.misses.push({it:it, chose:T.opts[k]});
  renderTest(false);
}
function nextQ(){
  if(T.picked === -1) return;
  T.i++;
  buildOpts();
  renderTest(true);
}
function renderTest(enter){
  var box = $("studyBody"); box.textContent = "";
  var n = T.deck.length;
  setMeter(T.i, n);
  if(!n){ emptyStudy(box); return; }
  if(T.i >= n){
    var s = el("div", "qcard result enter");
    var pct = Math.round(T.right / n * 100);
    var ring = el("div", "ring"); ring.style.setProperty("--p", pct); ring.appendChild(el("span", null, pct + "%"));
    s.appendChild(ring);
    s.appendChild(el("p", "qtext", "答對 " + T.right + " / " + n));
    if(T.misses.length){
      var ms = el("div", "misses");
      ms.appendChild(el("p", "sub-h", "答錯的題目"));
      T.misses.forEach(function(m){
        var r = el("div", "miss");
        r.appendChild(el("b", null, m.it.en));
        r.appendChild(el("span", null, m.it.zh));
        ms.appendChild(r);
      });
      s.appendChild(ms);
    }
    var acts = el("div", "acts"); acts.style.width = "100%";
    if(T.misses.length){
      var mark = el("button", "btn lg", "答錯的標成還不熟"); mark.type = "button";
      mark.addEventListener("click", function(){
        T.misses.forEach(function(m){ learned.delete(m.it.id); });
        save(); toast("已標成還不熟"); mark.disabled = true;
      });
      acts.appendChild(mark);
    }
    var again = el("button", "btn primary lg", "再測一次"); again.type = "button";
    again.addEventListener("click", startTest);
    var back = el("button", "btn lg", "回到首頁"); back.type = "button";
    back.addEventListener("click", exitStudy);
    acts.appendChild(again); acts.appendChild(back);
    s.appendChild(acts);
    box.appendChild(s);
    again.focus();
    return;
  }
  var it = T.deck[T.i];
  var card = el("div", "qcard" + (enter ? " enter" : ""));
  card.appendChild(qlabel(it));
  card.appendChild(el("p", "sub-h", "選出對應的英文"));
  card.appendChild(el("p", "qtext", it.zh));
  var opts = el("div", "opts");
  T.opts.forEach(function(o, k){
    var b = el("button", "opt"); b.type = "button";
    b.appendChild(el("span", "k", String(k + 1)));
    b.appendChild(el("span", null, o.en));
    if(T.picked !== -1){
      b.disabled = true;
      if(o === it) b.classList.add("right");
      else if(k === T.picked) b.classList.add("wrong");
    }
    b.addEventListener("click", function(){ pick(k); });
    opts.appendChild(b);
  });
  card.appendChild(opts);
  if(T.picked !== -1){
    var ok = T.opts[T.picked] === it;
    card.appendChild(el("p", "fb " + (ok ? "ok" : "no"), ok ? "答對了！" : "差一點，正確答案是綠色那個。"));
    var acts = el("div", "acts");
    var nx = el("button", "btn primary lg", T.i + 1 >= n ? "看結果" : "下一題"); nx.type = "button";
    nx.addEventListener("click", nextQ);
    acts.appendChild(nx);
    card.appendChild(acts);
    box.appendChild(card);
    nx.focus({preventScroll:true});
  } else {
    box.appendChild(card);
  }
  var hint = el("p", "hint");
  hint.innerHTML = '<kbd>1</kbd>–<kbd>4</kbd> 選答案　<kbd>Enter</kbd> 下一題　<kbd>Esc</kbd> 離開';
  box.appendChild(hint);
}

/* ---------- Keyboard ---------- */
document.addEventListener("keydown", function(e){
  if($("addDlg").open) return;
  var tag = (e.target && e.target.tagName) || "";
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(V.mode === "home"){
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); go(1); }
    else if(e.key === " " && tag !== "BUTTON"){ var f = $("flip"); if(f){ e.preventDefault(); f.classList.toggle("flipped"); } }
    return;
  }
  if(e.key === "Escape"){ e.preventDefault(); exitStudy(); return; }
  if(V.mode === "learn"){
    if(P.i >= P.deck.length) return;
    if(!P.shown && (e.key === " " || e.key === "Enter")){ e.preventDefault(); reveal(); return; }
    if(P.shown && e.key === "ArrowLeft"){ e.preventDefault(); answer(false); return; }
    if(P.shown && e.key === "ArrowRight"){ e.preventDefault(); answer(true); }
  } else if(V.mode === "test"){
    if(T.i >= T.deck.length) return;
    if(/^[1-4]$/.test(e.key)){ e.preventDefault(); pick(Number(e.key) - 1); return; }
    if(e.key === "Enter" && T.picked !== -1){ e.preventDefault(); nextQ(); }
  }
});

  e.preventDefault();
  var en = $("fEn").value.trim(), zh = $("fZh").value.trim();
  if(!en || !zh){ $("addMsg").textContent = "英文和中文都要填。"; return; }
  var it = {
    id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    tab: $("fTab").value, sec: $("fSec").value.trim() || "我的句子",
    en: en, zh: zh, ex: $("fEx").value.trim(), tone: $("fTone").value, custom: true
  };
  custom.push(it);
  save();
  $("fEn").value = ""; $("fZh").value = ""; $("fEx").value = "";
  $("addMsg").textContent = "已加入「" + tabName(it.tab) + " / " + it.sec + "」，可以繼續新增。";
  V.tab = it.tab;
  refreshSecList();
  renderHome();
  $("fEn").focus();
});

/* ---------- Account sync (only when hosted where it is available) ---------- */
function readSnap(s){
  if(!s) return null;
  var ex = typeof s.exists === "function" ? s.exists() : s.exists;
  if(ex === false) return null;
  var d = typeof s.data === "function" ? s.data() : (s.data !== undefined ? s.data : s);
  return d && typeof d === "object" ? d : null;
}
function initSync(){
  if(typeof claude === "undefined" || !claude || typeof claude.use !== "function") return;
  var timeout = new Promise(function(r){ setTimeout(function(){ r(null); }, 10000); });
  var work = (async function(){
    var db = await claude.use("db");
    var user = await claude.use("user");
    if(!db || !user) return null;
    var id = await user.id();
    var ref = db.collection("data/users/" + id).doc("bank");
    var s = await ref.get();
    var d = readSnap(s);
    dbDoc = ref;
    if(d && (d.fav || d.learned || d.custom)){
      applySnap(d);
      try{ localStorage.setItem(LS_KEY, JSON.stringify(snap())); }catch(e){}
      refreshSecList(); if(V.mode === "home") renderHome();
    } else {
      await ref.set(snap());
    }
    setSync("cloud");
    return true;
  })();
  Promise.race([work, timeout]).then(function(r){ if(!r) setSync("local"); }, function(){ setSync("local"); });
}

setSync("local");
refreshSecList();
renderHome();
initSync();
})();
</script>
