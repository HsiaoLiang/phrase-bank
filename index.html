ata cleaning, if that works for you. Someone else can do the charts.","neutral"],["聊課業和 group work","Can you walk me through how you got that?","你可以帶我看一下你是怎麼算出來的嗎？","Can you walk me through how you got that? I ended up with a different number.","neutral"],["聊課業和 group work","I'm a bit lost on question three.","我卡在第三題了。","I'm a bit lost on question three. Did you use the same formula?","casual"],["聊課業和 group work","Shall we sync again on Thursday?","我們週四再對一下進度好嗎？","Shall we sync again on Thursday once everyone has done their part?","neutral"],["約人和邀約","Are you around this weekend?","你這週末在嗎？","Are you around this weekend? A few of us are going to Borough Market.","casual"],["約人和邀約","Fancy grabbing a coffee after the lecture?","下課後想去喝杯咖啡嗎？","Fancy grabbing a coffee after the lecture? I need a break.","casual"],["約人和邀約","We're heading to the pub after class, you should come.","下課後我們要去酒吧，你要一起來。","We're heading to the pub after class, you should come along.","casual"],["約人和邀約","I'm up for it.","我可以啊，我有興趣。","Dinner on Friday? Yeah, I'm up for it.","casual"],["約人和邀約","Count me in.","算我一個。","Count me in. What time are we meeting?","casual"],["約人和邀約","I'll have to pass this time, but let's do it another time.","這次我先不去，下次再約。","I'll have to pass this time, I've got a deadline, but let's do it another time.","neutral"],["附和和回應","That makes sense.","有道理。","That makes sense. I hadn't thought about it that way.","neutral"],["附和和回應","Fair enough.","好吧，也合理。","You'd rather work alone? Fair enough.","casual"],["附和和回應","Tell me about it.","我懂，我超有同感。","The reading list is huge. Tell me about it.","casual"],["附和和回應","No way, seriously?","不會吧，真的嗎？","They moved the exam to Monday? No way, seriously?","casual"],["附和和回應","I couldn't agree more.","我完全同意。","I couldn't agree more. The first week felt far too packed.","neutral"],["附和和回應","That's a good shout.","這個提議不錯。（英式）","Doing it in the library? That's a good shout.","casual"],["同意或不同意","I see where you're coming from, but...","我懂你的想法，不過……","
